<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng tính THCS – Cô Thùy Tin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&subset=vietnamese&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D3557;--purple:#3D1A78}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#9B6BFF}
body{min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#4F7CFF,#B06BFF 55%,#FF5DA2);background-attachment:fixed;padding:24px 16px 60px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.25) 2.5px,transparent 3px);background-size:48px 48px}
.wrap{max-width:1180px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;text-align:center;margin-bottom:26px}
header svg{width:120px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
h1{font-weight:900;color:#fff;font-size:clamp(34px,6vw,64px);line-height:1.05;text-shadow:4px 0 0 var(--purple),-4px 0 0 var(--purple),0 4px 0 var(--purple),0 -4px 0 var(--purple),0 9px 0 rgba(20,20,50,.3)}
.sub{color:#fff;font-weight:800;font-size:clamp(15px,2.2vw,21px);margin-top:12px;text-shadow:0 2px 0 rgba(20,20,50,.3)}
h2{display:inline-block;margin:26px 0 14px;background:#FF006E;color:#fff;font-weight:900;font-size:22px;padding:8px 22px;border-radius:99px;border:4px solid var(--ink);box-shadow:0 5px 0 rgba(20,20,50,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
a.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:#fff;border:5px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(20,20,50,.35);transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 13px 0 rgba(20,20,50,.35);outline:none}
.top{display:flex;align-items:center;gap:14px;padding:16px 18px;color:#fff}
.ic{flex:none;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:32px;border:4px solid var(--ink)}
.num{font-weight:900;font-size:15px;opacity:.95;text-shadow:0 2px 0 rgba(20,20,50,.25)}
.ttl{font-weight:900;font-size:21px;line-height:1.2;text-shadow:0 2px 0 rgba(20,20,50,.3)}
ul{list-style:none;padding:14px 18px 6px;display:flex;flex-wrap:wrap;gap:6px}
li{font-weight:800;font-size:13.5px;background:#F1F3F5;border-radius:99px;padding:5px 11px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 18px 16px;font-weight:800;font-size:14px;color:#495057}
.go{background:#FF006E;color:#fff;font-weight:900;border-radius:99px;padding:8px 16px;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(20,20,50,.3)}
footer{text-align:center;color:#fff;font-weight:800;margin-top:36px;text-shadow:0 2px 0 rgba(20,20,50,.3)}
@media (prefers-reduced-motion:reduce){header svg{animation:none}a.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 200 240" aria-hidden="true"><line x1="100" y1="40" x2="100" y2="16" stroke="#1D3557" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="13" r="10" fill="#FF595E" stroke="#1D3557" stroke-width="4"/><rect x="20" y="70" width="20" height="44" rx="9" fill="#FF9F1C" stroke="#1D3557" stroke-width="5"/><rect x="160" y="70" width="20" height="44" rx="9" fill="#FF9F1C" stroke="#1D3557" stroke-width="5"/><rect x="30" y="36" width="140" height="112" rx="42" fill="#2EC4B6" stroke="#1D3557" stroke-width="6"/><rect x="47" y="54" width="106" height="74" rx="28" fill="#1B2A49"/><ellipse cx="78" cy="88" rx="11" ry="14" fill="#7DF9FF"/><ellipse cx="122" cy="88" rx="11" ry="14" fill="#7DF9FF"/><path d="M84 107 Q100 120 116 107" stroke="#7DF9FF" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="70" y="200" width="22" height="30" rx="9" fill="#ADB5BD" stroke="#1D3557" stroke-width="5"/><rect x="108" y="200" width="22" height="30" rx="9" fill="#ADB5BD" stroke="#1D3557" stroke-width="5"/><rect x="52" y="148" width="96" height="64" rx="24" fill="#FF9F1C" stroke="#1D3557" stroke-width="6"/><path d="M100 194 C78 180 82 162 94 166 Q100 168 100 175 Q100 168 106 166 C118 162 122 180 100 194Z" fill="#FF595E" stroke="#1D3557" stroke-width="3"/></svg>
    <div><h1>BẢNG TÍNH THCS</h1><div class="sub" id="sub">Chuỗi bài giảng zoom về phần mềm bảng tính – mỗi kiến thức một bài</div></div>
  </header>
  <div id="list"></div>
  <footer>Giáo viên – Cô Thùy Tin</footer>
</div>
<script src="ds.js"></script>
<script>
const MAU = [['#FFA62B','#FF5DA2'],['#3A8DFF','#00C2D1'],['#7AD86F','#14A0A0'],['#FFB14E','#FF5E78'],['#4F7CFF','#B06BFF'],['#22C493','#1E9BD7'],['#FF7F11','#FF006E'],['#B65CFF','#5A189A'],['#2EC4B6','#1982C4'],['#FF595E','#FFB14E']];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nhom = {};
DS.forEach(b => (nhom[b.lop] = nhom[b.lop] || []).push(b));
document.getElementById('sub').textContent = `${DS.length} bài • ${DS.reduce((s, b) => s + b.nq, 0)} câu đố • mỗi bài có giấy chứng nhận`;
document.getElementById('list').innerHTML = Object.keys(nhom).map(l => `<h2>${esc(l)}</h2><div class="grid">${nhom[l].map(b => {
  const m = MAU[(b.num - 1) % MAU.length], t = b.title.replace(/^Bài \d+\.\s*/, '');
  return `<a class="card" href="${esc(b.key)}/"><div class="top" style="background:linear-gradient(135deg,${m[0]},${m[1]})"><div class="ic">${esc(b.ic)}</div><div><div class="num">BÀI ${b.so || b.num}</div><div class="ttl">${esc(t)}</div></div></div>
    <ul>${b.topics.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <div class="foot"><span>❓ ${b.nq} câu đố • 🎓 chứng nhận</span><span class="go">▶ Học</span></div></a>`;
}).join('')}</div>`).join('');
</script>
</body>
</html>

# Tự dựng và đăng phiếu mỗi khi kho thay đổi (ví dụ cô tải config.json mới lên bằng trình duyệt).
# 1. Chạy tools/build_phieu.py: dựng phieu/*/index.html, phieu.json, bảng README.
# 2. Lưu các file vừa dựng vào kho (nếu có thay đổi).
# 3. Đưa toàn bộ trang lên GitHub Pages.
# Cần: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Dựng và đăng phiếu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dang-phieu
  cancel-in-progress: false

jobs:
  dung-va-dang:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dang.outputs.page_url }}
    steps:
      - name: Lấy kho
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dựng phiếu (kiểm tra lỗi nội dung)
        run: python3 tools/build_phieu.py

      - name: Lưu các file vừa dựng vào kho
        run: |
          if [ -n "$(git status --porcelain phieu phieu.json README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add phieu phieu.json README.md
            git commit -m "Tự dựng phiếu sau khi cập nhật"
            git push
          else
            echo "Không có gì thay đổi."
          fi

      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói trang web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Đăng lên web
        id: dang
        uses: actions/deploy-pages@v4
